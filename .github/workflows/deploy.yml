name: Deploy to AWS Lambda

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout del código
    - name: Checkout Code
      uses: actions/checkout@v3

    # Configurar .NET Core
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0' # Cambia según tu versión de .NET Core

    # Restaurar dependencias
    - name: Restore dependencies
      run: dotnet restore

    # Construir el proyecto
    - name: Build
      run: dotnet build --configuration Release --no-restore

    # Publicar el proyecto
    - name: Publish
      run: dotnet publish -c Release -o output

    # Empaquetar para AWS Lambda
    - name: Package for AWS Lambda
      run: |
        cd output
        zip -r ../Levara.WebApi.zip .

    # Desplegar a AWS Lambda
    - name: Deploy to AWS Lambda
      uses: docker://amazon/aws-cli:2.13.7
      with:
        entrypoint: /bin/sh
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1 # Cambia según tu región
      run: |
        aws lambda update-function-code \
          --function-name LevaraFuntions \
          --zip-file fileb://Levara.WebApi.zip
